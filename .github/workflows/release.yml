name: release
# Lives on the `release-ci` branch, kept separate from `axiom-cfsg-patches` (which holds only our
# patches). Run manually; it builds the `axiom-cfsg-patches` code and uploads the platform binaries
# to the given release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to upload to (must already exist)"
        required: true
        default: v0.4.26-offset-u64

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nanoda_bin-x86_64-linux
          - os: macos-13
            target: x86_64-apple-darwin
            asset: nanoda_bin-x86_64-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset: nanoda_bin-aarch64-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: axiom-cfsg-patches
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin nanoda_bin
      - name: Stage asset
        run: cp target/${{ matrix.target }}/release/nanoda_bin ${{ matrix.asset }}
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.asset }}
