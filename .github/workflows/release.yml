name: release
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: nanoda_bin-x86_64-linux
          - os: macos-13
            target: x86_64-apple-darwin
            asset: nanoda_bin-x86_64-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset: nanoda_bin-aarch64-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin nanoda_bin
      - name: Stage asset
        run: cp target/${{ matrix.target }}/release/nanoda_bin ${{ matrix.asset }}
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
